<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD - Análise</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="inputs">

        <fieldset>
            <form id="form">
                <input type="text" placeholder="nome" id="nome">
                <input type="email" placeholder="email" id="email">
                <input type="password" placeholder="senha" id="senha">
                <button type="submit">Registrar</button>
            </form>
        </fieldset>
        <br>
        <br>
        <br> 

        <fieldset>
            <form id="formatt">
                <input type="text" placeholder="id" id="attid" disabled>
                <input type="text" placeholder="nome" id="attnome">
                <input type="email" placeholder="email" id="attemail">
                <input type="password" placeholder="senha" id="attsenha">
                <button type="submit">Atualizar</button>
            </form>
        </fieldset>

        <br>
        <br>
        <br> 
    </div>

    <h1>Tabela</h1>

    <div class="tabela">
        
        <table border="1">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Email</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="listaUsuarios">
                <!-- O conteúdo da tabela virá aqui-->
            </tbody>
        </table>
    </div>

    <script src="scripts/index.js"></script>
</body>
</html>
